<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prism Player</title>

<style>
:root{--bg:#0d0d10;--tx:#f5f5f7;--mu:#9b9ba8;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1);--ac:#9ab8ff;--sp:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f2f2f5;--tx:#111;--mu:#6b6b76;--gl:rgba(255,255,255,.65);--bd:rgba(0,0,0,.08)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){--bg:#f2f2f5;--tx:#111;--mu:#6b6b76;--gl:rgba(255,255,255,.65);--bd:rgba(0,0,0,.08)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;min-height:100vh}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform calc(.15s*var(--sp))}button:active{transform:scale(.92)}
svg{width:1em;height:1em;fill:currentColor;flex:none}
#amb{position:fixed;top:-20%;left:-20%;right:-20%;bottom:-20%;filter:blur(80px);opacity:.55;transition:background 1s;z-index:0}
#app{position:relative;z-index:1;max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:22px 18px 170px;scrollbar-width:none}
.in{animation:in calc(.35s*var(--sp)) cubic-bezier(.2,.9,.3,1)}@keyframes in{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}h2{font-size:17px;font-weight:800;margin:26px 0 12px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.c{flex:none;width:132px;cursor:pointer}.c b,.t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.c i,.t i{font-style:normal;color:var(--mu);font-size:13px;display:block}
.big{width:250px}.art{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:28px;color:rgba(255,255,255,.75);margin-bottom:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.t{display:flex;gap:12px;align-items:center;padding:8px 0;cursor:pointer}.t .art{width:48px;margin:0;font-size:16px;border-radius:10px;flex:none}.t>div:nth-child(2){flex:1;min-width:0}
.t.on b{color:var(--ac)}
.g{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-radius:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.chip{flex:none;padding:9px 15px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-weight:600;font-size:13px}.chip.on{background:var(--ac);color:#111}
#mini{position:absolute;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding:8px 10px;display:flex;align-items:center;gap:10px;cursor:pointer;overflow:hidden}
#mini .art{width:44px;margin:0;font-size:14px;border-radius:10px}#mini .m{flex:1;min-width:0}#mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .ib{font-size:26px;padding:6px}#mb{position:absolute;left:0;bottom:0;height:2px;background:var(--ac)}
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:6px}nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;color:var(--mu);font-size:11px;font-weight:600}nav button svg{font-size:22px}nav .on{color:var(--tx);background:var(--gl)}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);transform:translateY(100%);transition:transform calc(.5s*var(--sp)) cubic-bezier(.2,.9,.25,1);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px 30px}.ov.o{transform:none}
.ov .bgx{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;opacity:.6;filter:blur(70px) saturate(1.5)}
.np .art{width:min(78vw,340px);margin:14px auto 22px;font-size:64px;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.4);transition:transform .8s}.np .art.pl{transform:scale(1)}.np .art:not(.pl){transform:scale(.88)}
.np h3{font-size:24px;font-weight:800;letter-spacing:-.02em}.np .top{display:flex;justify-content:space-between;font-size:26px}
.bar{height:5px;background:var(--gl);border-radius:9px;margin:20px 0 6px;position:relative;cursor:pointer}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--tx);border-radius:9px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.ctl button{font-size:24px;padding:10px;opacity:.8}.ctl .pp{font-size:34px;background:var(--tx);color:var(--bg);border-radius:50%;width:74px;height:74px;display:grid;place-items:center;opacity:1}.ctl .on{color:var(--ac);opacity:1}
.lp{padding:16px 18px;margin-top:14px;cursor:pointer;font-size:18px;font-weight:600}.lp span{opacity:.4;display:block}
.ly p{font-size:calc(28px*var(--lz,1));font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:18px 0;opacity:.3;transform-origin:left;transition:all calc(.5s*var(--sp)) cubic-bezier(.3,1.5,.5,1);cursor:pointer;filter:blur(1px)}
.ly p.on{opacity:1;transform:scale(1.06);filter:none;text-shadow:0 0 28px var(--ac)}.ly p.p{opacity:.55}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}.sheet>div{width:100%;max-width:560px;margin:0 auto;padding:22px;border-radius:26px 26px 0 0;background:var(--bg);animation:in .3s}
input.i{width:100%;padding:14px 16px;border-radius:14px;background:var(--gl);border:1px solid var(--bd);color:var(--tx);font:inherit;margin-bottom:12px}
.btn{padding:12px 20px;border-radius:99px;background:var(--ac);color:#111;font-weight:800}.btn.s{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm i{aspect-ratio:1;border-radius:6px;background:var(--ac)}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;background:var(--ac);border-radius:8px 8px 3px 3px;min-height:4px;transition:height .6s}
.pb{height:6px;border-radius:9px;background:var(--gl);margin-top:6px}.pb i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.wrap{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:40px 30px;transition:background .5s;color:#fff}
.wrap .pr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:5px}.wrap .pr i{flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.3)}.wrap .pr i.d{background:#fff}
.wrap .n{font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:1;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}.wrap p{font-size:20px;font-weight:600;margin:10px 0;opacity:.9}.wrap .art{width:200px;font-size:60px;animation:pop .7s}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--gl);font-size:11px;font-weight:600;color:var(--mu)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;padding:12px 18px;animation:in .3s;max-width:90%;font-size:13px}
.heart{animation:hp .5s cubic-bezier(.3,1.8,.5,1)}@keyframes hp{50%{transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body><div id="err" style="display:none;position:fixed;z-index:99;top:0;left:0;right:0;padding:12px;background:#b00020;color:#fff;font:12px monospace"></div><div id="amb"></div><div id="app"><div id="view"></div><div id="mini" class="g"></div><nav class="g" id="nav"></nav></div>
<div class="ov np" id="np"></div><div class="ov ly" id="ly"></div><div id="ex"></div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById("err");e.style.display="block";e.textContent="Error: "+m+" (line "+l+")"};
const $=s=>document.querySelector(s),I={
play:'M8 5v14l11-7z',pause:'M7 5h4v14H7zM13 5h4v14h-4z',next:'M6 6l9 6-9 6zM16 6h2.5v12H16z',prev:'M18 6l-9 6 9 6zM5.5 6H8v12H5.5z',
heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 10c0 6-8 11-8 11z',home:'M4 11l8-7 8 7v9h-5v-6H9v6H4z',lib:'M4 4h3v16H4zM9 4h3v16H9zM14.5 6l3-.8 3 13.5-3 .8z',
search:'M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z',stats:'M4 20v-9h4v9zM10 20V4h4v16zM16 20v-6h4v6z',gear:'M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM11 2h2l.6 2.6 2.3 1 2.3-1.4 1.4 1.4-1.4 2.3 1 2.3L22 11v2l-2.6.6-1 2.3 1.4 2.3-1.4 1.4-2.3-1.4-2.3 1L13 22h-2l-.6-2.6-2.3-1-2.3 1.4-1.4-1.4 1.4-2.3-1-2.3L2 13v-2l2.6-.6 1-2.3-1.4-2.3 1.4-1.4 2.3 1.4 2.3-1z',
shuf:'M3 17h3l10-10h5v2h-4L7 19H3zm13 0h5v2h-5l-3-3 1.4-1.4zM3 7h4l3 3-1.4 1.4L6 9H3z',rep:'M6 6h11V3l4 4-4 4V8H8v3H6zm12 12H7v3l-4-4 4-4v3h9v-3h2z',q:'M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm14-1v-3h2v5.5a2.5 2.5 0 11-2-2.4z',
down:'M6 9l6 6 6-6',plus:'M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z'};
const ic=(n,s)=>`<svg viewBox="0 0 24 24"${s?` style="${s}"`:''}><path d="${I[n]}"/></svg>`;
const G=['Electronic','Indie','Ambient','Pop','Jazz'];
const T=[['Neon Tides','Aria Vale','Glasshouse',0,200,210,'demo'],['Paper Moons','Aria Vale','Glasshouse',1,180,240,'demo'],['Slow Circuit','Kiro','Static Bloom',0,150,195,'demo'],['Velvet Hours','Mae Linden','Sunroom',4,30,225,'demo'],['Low Orbit','Kiro','Static Bloom',2,260,260,'demo'],['Amber Static','Juno Reyes','Afterglow',1,25,205,'demo'],['Halcyon','Mae Linden','Sunroom',3,320,190,'demo'],['Drift Signal','Juno Reyes','Afterglow',2,190,215,'demo']].map((r,i)=>({id:i,t:r[0],a:r[1],al:r[2],g:G[r[3]],h:r[4],d:r[5],s:r[6],sp:r[6]=='spotify',added:i}));
const LY=["Lights fold into the water","We keep the quiet moving","{t} hums beneath my ribs","Hold on, the night is wide open","Nothing here is in a hurry","Say it softly, let it land","We were always almost there","Now the morning finds our names"];
const lyr=t=>t.src||t.sp?null:LY.map((l,i)=>[6+i*(t.d-14)/8,l.replace('{t}',t.t)]);
const day=(o=0)=>{const d=new Date(Date.now()-o*864e5);return d.toISOString().slice(0,10)};
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const DEMO={};for(let o=0;o<400;o++){const dk=day(o);if(rnd()<.2)continue;DEMO[dk]={};const n=1+Math.floor(rnd()*5);for(let k=0;k<n;k++){const id=Math.floor(rnd()*rnd()*8),p=1+Math.floor(rnd()*4);DEMO[dk][id]=(DEMO[dk][id]||[0,0]).map((v,j)=>v+(j?p*T[id].d*.8:p))}}
let S={q:T.map(t=>t.id),i:0,pos:0,playing:false,shuf:0,rep:0,fav:[0,3],rec:[0,3,1,5,2],D:{},ev:[],
 pl:[{id:1,name:'Late Night Drive',ids:[0,2,4,5],demo:1},{id:2,name:'Focus Glass',ids:[1,3,6],demo:1}],
 set:{theme:'system',ac:'#9ab8ff',anim:1,demo:1,lz:1,sp:0}};
try{const x=JSON.parse(localStorage.getItem('prism')||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('prism',JSON.stringify(S))}catch(e){}};
const cur=()=>T.find(t=>t.id===S.q[S.i])||T[0],tk=id=>T.find(t=>t.id==id);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`,hm=s=>`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`;
const art=(t,c='')=>`<div class="art ${c}" style="background:linear-gradient(135deg,hsl(${t.h} 70% 58%),hsl(${(t.h+55)%360} 60% 26%))">${t.t[0]}</div>`;
const card=(t,c='')=>`<div class="c ${c}" data-a="play" data-id="${t.id}">${art(t)}<b>${t.t}</b><i>${t.a}</i></div>`;
const trow=(t,l)=>`<div class="t ${cur().id==t.id&&S.playing?'on':''}" data-a="play" data-id="${t.id}" data-l="${l||''}">${art(t)}<div><b>${t.t}</b><i>${t.a} · ${t.al}</i></div>${t.sp?'<span class="tag">Spotify</span>':t.src?'<span class="tag">Local</span>':''}<button data-a="fav" data-id="${t.id}" style="font-size:20px;color:${S.fav.includes(t.id)?'var(--ac)':'var(--mu)'}">${ic('heart')}</button></div>`;
const toast=m=>{const e=document.createElement('div');e.className='toast g';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2600)};
const vt=f=>document.startViewTransition&&S.set.anim?document.startViewTransition(f):f();
/* stats */
const allD=()=>{const M={};const add=D=>Object.entries(D).forEach(([k,v])=>{M[k]=M[k]||{};Object.entries(v).forEach(([id,x])=>{const m=M[k][id]=M[k][id]||[0,0];m[0]+=x[0];m[1]+=x[1]})});if(S.set.demo)add(DEMO);add(S.D);return M};
const agg=f=>{const M=allD(),r={p:0,s:0,tr:{},ar:{},al:{},g:{},days:0};Object.entries(M).filter(([k])=>f(k)).forEach(([k,v])=>{r.days++;Object.entries(v).forEach(([id,x])=>{const t=tk(id);if(!t)return;r.p+=x[0];r.s+=x[1];[['tr',t.t],['ar',t.a],['al',t.al],['g',t.g]].forEach(([n,key])=>{r[n][key]=(r[n][key]||[0,0]);r[n][key][0]+=x[0];r[n][key][1]+=x[1]})})});return r};
const tops=(o,n=5)=>Object.entries(o).sort((a,b)=>b[1][1]-a[1][1]).slice(0,n);
const streak=()=>{const M=allD();let n=0;for(let o=M[day()]?0:1;M[day(o)];o++)n++;return n};
/* engine */
const au=new Audio();let ax,osc=[];
function synth(on){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];if(!on)return;try{ax=ax||new AudioContext();const g=ax.createGain();g.gain.value=.025;g.connect(ax.destination);const f=110*Math.pow(2,(cur().h%12)/12);[1,1.5,2,2.5].forEach((m,i)=>{const o=ax.createOscillator();o.type='triangle';o.frequency.value=f*m;o.detune.value=i*4;o.connect(g);o.start();osc.push(o)})}catch(e){}}
function log(e,id){S.ev.push([e,id,Date.now()]);if(S.ev.length>500)S.ev.shift()}
function start(){const t=cur();S.pos=0;au.pause();synth(0);const d=S.D[day()]=S.D[day()]||{};d[t.id]=d[t.id]||[0,0];d[t.id][0]++;log('start',t.id);S.rec=[t.id,...S.rec.filter(x=>x!=t.id)].slice(0,12);
 if(t.src){au.src=t.src;au.playbackRate=S.set.sp2||1;au.volume=S.set.vol??1;au.play()}else if(t.sp){if(!S.sp||!t.uri)toast('Connect Spotify (Premium) in Settings and import your playlists to hear Spotify tracks.');else spPlay(t)}else if(S.playing)synth(1)}
function play(id,list){const l=list?list.split(',').map(Number):S.q;if(list)S.q=l;S.i=Math.max(0,S.q.indexOf(+id));S.playing=true;start();upd()}
function pp(){S.playing=!S.playing;const t=cur();log(S.playing?'resume':'pause',t.id);if(t.src)S.playing?au.play():au.pause();else if(!t.sp)synth(S.playing);else if(t.uri&&S.sp)spApi('/me/player/'+(S.playing?'play':'pause'),{method:'PUT'});upd()}

setInterval(save,4000);
function tick(){const t=cur(),p=S.pos/(t.d)*100;$('#mb').style.width=p+'%';const b=$('#pbar');if(b){b.firstChild.style.width=p+'%';$('#tc').textContent=fmt(S.pos);$('#tr').textContent='-'+fmt(t.d-S.pos)}lyTick()}
function lyTick(){const L=lyr(cur());if(!L)return;let a=0;L.forEach((l,i)=>{if(S.pos>=l[0])a=i});if(S.la!==a||S.lt!==cur().id){S.la=a;S.lt=cur().id;const pv=$('#lpv');if(pv)pv.innerHTML=`${L[a][1]}<span>${(L[a+1]||['',''])[1]}</span>`;document.querySelectorAll('#ly p').forEach((p,i)=>{p.className=i==a?'on':i<a?'p':'';if(i==a&&!S.sc)p.scrollIntoView({behavior:'smooth',block:'center'})})}}
/* views */
let tab='home',lib='Songs',sort='Recently Added',pid=null,q='';
const nav=[['home','Home'],['lib','Library'],['search','Search'],['stats','Stats'],['set','Settings']];
function view(){const v=$('#view');v.innerHTML=({home,lib:library,search,stats,set:settings}[tab])();v.classList.remove('in');void v.offsetWidth;v.classList.add('in');$('#nav').innerHTML=nav.map(n=>`<button data-a="tab" data-id="${n[0]}" class="${tab==n[0]?'on':''}">${ic(n[0]==='lib'?'lib':n[0]==='set'?'gear':n[0])}${n[1]}</button>`).join('')}
function home(){const F=T.filter(t=>S.fav.includes(t.id)),r=S.rec.map(tk),mix=agg(k=>1),tg=tops(mix.g,1)[0];
 return`<h1>${['Good night','Good morning','Good afternoon','Good evening'][Math.floor(new Date().getHours()/6)]}</h1>
 <div class="chips"><button class="chip" data-a="imp">Add music</button><button class="chip" data-a="plnew">New playlist</button><button class="chip" data-a="ly0">Lyrics</button><button class="chip" data-a="tab" data-id="stats">Statistics</button></div>
 <div class="g" data-a="wrap" style="padding:18px;margin-top:14px;cursor:pointer;background:var(--gl)"><b style="font-size:18px">Your ${new Date().toLocaleString('en',{month:'long'})} Wrap</b><div class="mu">Tap to see your month in music</div></div>
 <h2>Continue listening</h2><div class="row">${r.slice(0,4).map(t=>card(t,'big')).join('')}</div>
 <h2>Recently played</h2><div class="row">${r.map(t=>card(t)).join('')}</div>
 <h2>Your favorites</h2>${F.map(t=>trow(t,F.map(x=>x.id))).join('')||'<p class="mu">Tap the heart on any song.</p>'}
 <h2>Made for you</h2><div class="row">${[tg?tg[0]+' Mix':'Daily Mix',...G.slice(0,2).map(g=>g+' Mix')].map((n,i)=>{const g=n.replace(' Mix','');const l=T.filter(t=>t.g==g||!i&&!tg).map(t=>t.id);return`<div class="c" data-a="play" data-id="${l[0]??0}" data-l="${l}"><div class="art" style="background:linear-gradient(135deg,hsl(${i*90+200} 60% 50%),#222)">${n[0]}</div><b>${n}</b><i>Based on your history</i></div>`}).join('')}</div>
